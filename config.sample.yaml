# dex configuration sample — copy to ~/.config/dex/config.yaml
# All fields optional; env vars (OPENAI_API_KEY, OPENAI_MODEL, DEX_*) override these.

provider: opencode          # opencode | openai-codex
api_key: your-provider-api-key
base_url: https://opencode.ai/zen/v1
model: gpt-5.6-luna         # static model selection
api: openai-responses       # wire protocol: openai-responses | openai-completions

# Extra models shown by /model autocomplete. Leave unset to use the provider's
# live /models list (DEX_MODELS also works, comma-separated).
# models: [gpt-5.6-luna]

# Named OpenAI-compatible endpoints: their live /models lists show up in
# /model autocomplete prefixed as <name>/<model-id>, and picking one routes
# requests to that base_url (same api_key as above). When base_url is already
# an opencode.ai URL, zen + go are added automatically; set `endpoints: {}` to
# disable.
# endpoints:
#   zen: https://opencode.ai/zen/v1
#   go: https://opencode.ai/zen/go/v1

thinking_effort: medium     # optional reasoning effort passed to the API
context_window: 128000    # pi: per-model auto (gpt-5.6 1050000, claude 200k, muse 1048576) — set only to override
reserve_tokens: 16384     # pi: compaction.reserveTokens
keep_recent_tokens: 20000 # pi: compaction.keepRecentTokens
# max_tool_iterations: 60
# max_prompt_tokens: 128000
# max_tool_output_bytes: 1048576
# max_turn_seconds: 900
# http_connect_timeout_secs: 10
# http_request_timeout_secs: 300
