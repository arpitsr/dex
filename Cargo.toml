[package]
name = "dex"
version = "0.1.0"
edition = "2021"

[features]
network-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
termimad = "0.31"
chrono = "0.4"
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
ratatui-markdown = { version = "0.3.6", features = [
    "highlight-lang-bash",
    "highlight-lang-c",
    "highlight-lang-cpp",
    "highlight-lang-go",
    "highlight-lang-java",
    "highlight-lang-javascript",
    "highlight-lang-json",
    "highlight-lang-python",
    "highlight-lang-rust",
    "highlight-lang-typescript",
    "highlight-lang-toml",
    "highlight-lang-yaml",
] }
unicode-width = "0.1"

# Client-server architecture
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
async-stream = "0.3"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
terminal-colorsaurus = "1.0.3"
