[package]
name = "ak"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
termimad = "0.31"
chrono = "0.4"
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
ratatui-markdown = { version = "0.3.6", features = [
    "highlight-lang-bash",
    "highlight-lang-c",
    "highlight-lang-cpp",
    "highlight-lang-go",
    "highlight-lang-java",
    "highlight-lang-javascript",
    "highlight-lang-json",
    "highlight-lang-python",
    "highlight-lang-rust",
    "highlight-lang-typescript",
    "highlight-lang-toml",
    "highlight-lang-yaml",
] }
unicode-width = "0.1"
